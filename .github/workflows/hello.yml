name: hello                      # Actions 탭에 표시될 이름
on: push                         # 언제? push가 발생하면

jobs:
  say-hello:                     # job의 id
    runs-on: ubuntu-latest       # 어디서? 우분투 러너에서
    steps:                       # 무엇을? 위에서부터 순서대로
      - name: 인사하기
        run: echo "Hello, GitHub Actions!"
      - name: 실행 환경 확인
        run: |
          date
          python3 --version
          echo "현재 폴더: $(pwd)"